{% extends "layout.html" %}

{% block content %}

<div class="pdf-page">


<!-- Drag Drop Overlay -->

<div class="drop-overlay" id="dropOverlay">

<div class="drop-box">
<div class="drop-icon">📄</div>
<h2>أسقط ملف PDF هنا</h2>
</div>

</div>


<!-- Analysis Toolbar -->

<div class="analysis-toolbar" id="analysisToolbar">

<div class="tools-scroll">

<button class="tool-chip" onclick="triggerAnalysis('summary')">
📝 تلخيص
</button>

<button class="tool-chip" onclick="triggerAnalysis('key_points')">
🔑 النقاط الرئيسية
</button>

<button class="tool-chip" onclick="triggerAnalysis('questions')">
❓ توليد أسئلة
</button>

<button class="tool-chip" onclick="triggerAnalysis('explain')">
🧠 شرح المحتوى
</button>

<button class="tool-chip" onclick="triggerAnalysis('full_analysis')">
🚀 تحليل شامل
</button>

</div>

</div>


<!-- Chat Area -->

<main id="chat-container">

<div class="message-row ai">

<div class="message-wrapper">

<div class="sender-name">
AI Assistant
</div>

<div class="message-bubble">
مرحباً! أنا مساعدك الأكاديمي. يمكنك رفع ملف PDF أو طرح أي سؤال.
</div>

</div>

</div>

</main>


<!-- Input -->

<div class="input-wrapper">

<div class="input-box">

<input type="file" id="fileInput" accept=".pdf" hidden>

<button class="upload-btn" id="uploadBtn" title="رفع ملف PDF">

📎

</button>

<div class="file-status-pill" id="fileStatus"></div>

<textarea
id="userInput"
rows="1"
placeholder="اكتب رسالتك هنا..."
></textarea>

<button class="send-btn" id="sendBtn" disabled>

➤

</button>

</div>

</div>

</div>


<style>


.upload-btn{
font-size:24px;
width:48px;
height:48px;
display:flex;
align-items:center;
justify-content:center;
}


.send-btn{
font-size:20px;
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
}


.message-bubble{
white-space:pre-wrap;
line-height:1.7;
}

#chat-container{
height:calc(100vh - 220px);
overflow-y:auto;
}

</style>


<script>


const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const fileStatus = document.getElementById("fileStatus");
const analysisToolbar = document.getElementById("analysisToolbar");
const chatContainer = document.getElementById("chat-container");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const dropOverlay = document.getElementById("dropOverlay");

let currentFile = null;


/* AUTO SCROLL */

function autoScroll(){

chatContainer.scrollTo({
top:chatContainer.scrollHeight,
behavior:"smooth"
});

}



/* TEXTAREA AUTO SIZE */

userInput.addEventListener("input", function(){

this.style.height = "auto";
this.style.height = this.scrollHeight + "px";

if(this.value.trim().length > 0){
sendBtn.removeAttribute("disabled");
}else{
sendBtn.setAttribute("disabled","true");
}

});



/* FILE BUTTON */

uploadBtn.addEventListener("click", () => fileInput.click());



/* FILE SELECT */

fileInput.addEventListener("change", async (e)=>{

if(e.target.files.length > 0){

await handleFile(e.target.files[0]);

}

});



/* DRAG DROP */

document.body.addEventListener("dragover",(e)=>{
e.preventDefault();
dropOverlay.style.display="flex";
});

dropOverlay.addEventListener("dragleave",(e)=>{
e.preventDefault();
dropOverlay.style.display="none";
});

dropOverlay.addEventListener("drop", async (e)=>{

e.preventDefault();
dropOverlay.style.display="none";

if(e.dataTransfer.files.length > 0){

await handleFile(e.dataTransfer.files[0]);

}

});



/* HANDLE FILE */

async function handleFile(file){

if(file.type !== "application/pdf"){

addMessage("عذراً، يرجى رفع ملف PDF فقط.","ai");
return;

}

currentFile = file;

fileStatus.textContent = "جارِ رفع الملف...";
fileStatus.style.display = "block";

const formData = new FormData();
formData.append("file", file);

try{

const response = await fetch("/upload_pdf",{
method:"POST",
body:formData
});

if(!response.ok){
throw new Error("Upload failed");
}

const data = await response.json();

if(data.error){
addMessage(data.error,"ai");
fileStatus.textContent = "فشل رفع الملف";
return;
}

fileStatus.textContent = file.name;

addMessage(`تم رفع الملف "${file.name}" بنجاح. اختر نوع التحليل من الأعلى.`,"ai");

analysisToolbar.classList.add("active");

}catch(err){

fileStatus.textContent = "فشل رفع الملف";
addMessage("حدث خطأ أثناء رفع الملف.","ai");

}

}



/* ADD MESSAGE */

function addMessage(text,sender){

const row = document.createElement("div");
row.className = `message-row ${sender}`;

const wrapper = document.createElement("div");
wrapper.className = "message-wrapper";

const name = document.createElement("div");
name.className = "sender-name";
name.textContent = sender === "user" ? "أنت" : "AI Assistant";

const bubble = document.createElement("div");
bubble.className = "message-bubble";

bubble.innerHTML = text.replace(/\n/g,"<br>");

wrapper.appendChild(name);
wrapper.appendChild(bubble);

row.appendChild(wrapper);

chatContainer.appendChild(row);

autoScroll();

}



/* ANALYSIS */

window.triggerAnalysis = async function(type){

if(!currentFile) return;

addMessage("جاري تحليل الملف...","ai");

const formData = new FormData();
formData.append("analysis_type",type);

const response = await fetch("/analyze_pdf",{
method:"POST",
body:formData
});

const data = await response.json();

addMessage(data.reply || "تم التحليل.","ai");

}



/* CHAT */

async function handleSend(){

const text = userInput.value.trim();
if(!text) return;

addMessage(text,"user");

userInput.value = "";
sendBtn.setAttribute("disabled","true");

const response = await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text,
mode:"pdf"
})

});

const data = await response.json();

addMessage(data.reply || "لا يوجد رد.","ai");

}



/* SEND BUTTON */

sendBtn.addEventListener("click",handleSend);



/* ENTER TO SEND */

userInput.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();
handleSend();

}

});


</script>

{% endblock %}
